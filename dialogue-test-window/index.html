<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凯尔希 · 对话测试</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101816;color:#e7eeea}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:0 auto;height:100dvh;padding:26px 24px;display:flex;flex-direction:column;gap:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;font-weight:600;margin:0 0 6px}p{color:#9eadA5;font-size:13px;margin:0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,textarea{font:inherit;color:inherit;background:#18231f;border:1px solid #35473e;border-radius:10px;padding:12px;outline:none}input:focus,textarea:focus{border-color:#a3c5ad}input{width:150px}button{font:inherit;cursor:pointer;border:1px solid #40594a;background:#25392e;color:#e7eeea;padding:10px 16px;border-radius:10px}button:hover{background:#334c3c}button:disabled{opacity:.5;cursor:default}.small{font-size:13px;color:#b0beb6}details{color:#aebcb4;font-size:13px}details textarea{margin-top:10px;width:100%;height:95px;resize:vertical}.chat{flex:1;min-height:100px;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:14px 4px}.empty{margin:auto;text-align:center;color:#82978a;line-height:1.8}.entry{max-width:84%;display:flex;flex-direction:column;gap:6px;align-self:flex-start}.entry.user{align-self:flex-end}.name{font-size:12px;color:#8da393}.bubble{padding:13px 17px;background:#1c2a23;border:1px solid #2b4233;border-radius:15px;white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.user .bubble{background:#314435;border-color:#435d48}.compose{display:flex;align-items:flex-end;gap:12px}.compose textarea{flex:1;height:94px;resize:vertical}.foot{min-height:20px;font-size:12px;color:#91a396}.error{color:#efa8a0}@media(max-width:600px){main{padding:18px 14px}h1{font-size:20px}.entry{max-width:94%}.compose{gap:8px}.compose button{padding:11px}}
</style></head><body><main>
<header><div><h1>凯尔希 · 对话测试</h1><p>思衡托阶段 · 测试独立于 QQ 群</p></div><div><a href="/slang.html" target="_blank" style="color:#b0cdb8;margin-right:12px">话题与用语库</a><button id="clear">重新开始</button></div></header>
<div class="controls"><label class="small">你的昵称 <input id="nickname" value="晨星" maxlength="40"></label><span class="small" id="profile">读取当前配置…</span></div>
<details id="turn-debug" hidden><summary>本次对话判断（调试）</summary><div id="turn-debug-value" class="small"></div><p>用于区分理解与回应选择；短标签是辅助信息，不代表内部思维过程</p></details>
<details><summary>添加前情（可选，开始一段新对话时填写）</summary><textarea id="context" maxlength="6000" placeholder="例如：&#10;晨星：你劝我们休息，自己却还没停&#10;凯尔希：博士，我确实又给自己留了例外"></textarea></details>
<section class="chat" id="chat" aria-live="polite"><div class="empty" id="empty">从一句话开始<br>可以试试问候、玩笑，或聊聊她在意的事</div></section>
<form id="form" class="compose"><textarea id="message" maxlength="4000" placeholder="和凯尔希说点什么…" aria-label="聊天消息"></textarea><button id="send" type="submit">发送</button></form>
<div class="foot" id="status">Enter 发送 · Shift + Enter 换行</div>
</main><script>
const $=id=>document.getElementById(id);let history=[],busy=false;const storageKey='kaltsit-dialogue-test.v1';let testId=localStorage.getItem('kaltsit-dialogue-test.id')||crypto.randomUUID().replaceAll('-','');localStorage.setItem('kaltsit-dialogue-test.id',testId);
function save(){try{localStorage.setItem(storageKey,JSON.stringify({history:history.slice(-100),nickname:$('nickname').value,context:$('context').value,draft:$('message').value}));}catch{}}
function showProfile(data){$('profile').textContent=`${data.model} · ${data.reasoning} · ${data.web_search==='live'?'联网可用':'联网关闭'}`+(data.voice_preview?' · 当前表达版本':'');}
function showChoice(data){const panel=$('turn-debug');panel.hidden=!data.voice_preview?.systematic_debug;if(panel.hidden)return;const names={greeting:'问候',banter:'调侃',banter_pushback:'反逗／推回玩笑',clarification:'澄清',fact_check:'核实',correction:'纠正',care:'关切',opinion:'意见',story:'讲述',request:'请求',boundary:'边界',answer:'回答',return_tease:'回敬',join:'加入玩笑',correct:'更正',hold:'保留判断',accept:'接纳',decline:'拒绝',listen:'倾听',ask:'询问',narrate:'叙述',user:'当前用户',self:'凯尔希',other:'其他人',none:'无',unclear:'不明'};const choice=data.turn_choice;$('turn-debug-value').textContent=choice?`话头：${names[choice.act]||choice.act} · 回应：${names[choice.stance]||choice.stance} · 玩笑起头者：${names[choice.play_origin]||choice.play_origin}`:'本轮未取得有效标签，正文已正常交付';}
function entry(name,text,user){$('empty')?.remove();const row=document.createElement('div');row.className='entry'+(user?' user':'');const label=document.createElement('div');label.className='name';label.textContent=name;const body=document.createElement('div');body.className='bubble';body.textContent=text;row.append(label,body);$('chat').append(row);$('chat').scrollTop=$('chat').scrollHeight;}
function replyEntry(name,bubbles){bubbles.forEach((text,i)=>entry(i===0?name:'',text,false));}
function pending(value){busy=value;$('send').disabled=value;$('clear').disabled=value;$('nickname').disabled=value;$('context').disabled=value;}
$('clear').onclick=()=>{const oldId=testId;fetch('/social/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test_id:oldId})}).catch(()=>{});testId=crypto.randomUUID().replaceAll('-','');localStorage.setItem('kaltsit-dialogue-test.id',testId);history=[];$('chat').replaceChildren();$('context').value='';$('message').value='';save();$('status').textContent='已开始新对话';$('message').focus();};
for(const id of ['nickname','context','message'])$(id).addEventListener('input',save);
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){$('nickname').value=typeof saved.nickname==='string'?saved.nickname:'晨星';$('context').value=typeof saved.context==='string'?saved.context:'';$('message').value=typeof saved.draft==='string'?saved.draft:'';history=Array.isArray(saved.history)?saved.history.filter(row=>row&&['user','assistant'].includes(row.role)&&typeof row.text==='string'&&typeof row.nickname==='string').slice(-100):[];for(const row of history){if(row.role==='assistant'&&Array.isArray(row.bubbles)&&row.bubbles.length<=3&&row.bubbles.every(x=>typeof x==='string'))replyEntry(row.nickname,row.bubbles);else entry(row.nickname,row.text,row.role==='user');}}}catch{}
fetch('/health').then(res=>res.json()).then(showProfile).catch(()=>{$('profile').textContent='等待测试服务';});
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const message=$('message').value.trim();if(!message)return;const nickname=$('nickname').value.trim()||'博士';const previous=history.slice(-15);entry(nickname,message,true);history.push({role:'user',nickname,text:message});$('message').value='';save();pending(true);$('status').className='foot';$('status').textContent='凯尔希正在回应…';
try{const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname,message,context:$('context').value,history:previous,test_id:testId})});const data=await res.json();if(!res.ok)throw new Error(data.error||'暂时没有收到回复');const bubbles=Array.isArray(data.bubbles)?data.bubbles:[data.reply];replyEntry('凯尔希',bubbles);history.push({role:'assistant',nickname:'凯尔希',text:data.reply,bubbles});history=history.slice(-100);showProfile(data);showChoice(data);save();let acknowledged=true;if(data.delivery_id){try{const ack=await fetch('/chat/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test_id:testId,delivery_id:data.delivery_id})});acknowledged=ack.ok;}catch{acknowledged=false;}}$('status').textContent=`本次 ${data.seconds} 秒 · ${bubbles.length}条气泡 · Enter 发送`+(acknowledged?'':' · 回复已显示，后续状态暂未保存');}
catch(err){history.pop();$('message').value=message;save();$('status').className='foot error';$('status').textContent=err.message;}
finally{pending(false);$('message').focus();}};
</script></body></html>
