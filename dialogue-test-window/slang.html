<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凯尔希 · 话题与用语库</title>
<style>body{font:15px system-ui;background:#101816;color:#e7eeea;max-width:850px;margin:35px auto;padding:0 20px}p{color:#9eafa4}select,input,textarea,button{font:inherit;background:#1c2a23;color:inherit;border:1px solid #40594a;border-radius:8px;padding:9px}select,textarea{width:100%;box-sizing:border-box}textarea{margin:8px 0;min-height:65px}article{border:1px solid #304636;border-radius:12px;padding:16px;margin:14px 0}button{cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#a1b3a5}</style>
<h1>话题与群内用语</h1><p>仅本机审核。候选不会进入稳定释义；确认前请检查语境。PRTS资料和凯尔希角色卡始终优先。测试与QQ各会话相互隔离。</p>
<select id="scope" aria-label="会话范围"></select><p id="status"></p><h2>进行中的话题</h2><div id="threads"></div><h2>用语</h2><div id="terms"></div>
<script>
const $=id=>document.getElementById(id);const testId=localStorage.getItem('kaltsit-dialogue-test.id')||crypto.randomUUID().replaceAll('-','');localStorage.setItem('kaltsit-dialogue-test.id',testId);
function node(tag,content){const n=document.createElement(tag);n.textContent=content;return n;}
async function refresh(scope){try{const res=await fetch('/slang?scope='+encodeURIComponent(scope));const d=await res.json();if(!res.ok)throw Error(d.error);$('scope').replaceChildren(...d.scopes.map(s=>{const o=node('option',s.startsWith('test:')?'当前测试对话':s);o.value=s;o.selected=s===scope;return o}));$('threads').replaceChildren(...d.threads.map(t=>node('p',t.topic+(t.progress?' · '+t.progress:'')+(t.pending_question?' · 待继续：'+t.pending_question:''))));if(!d.threads.length)$('threads').append(node('small','没有未结束的话题，或已过期'));
$('terms').replaceChildren();for(const t of d.terms){const card=node('article','');card.append(node('strong',t.term+' · '+({candidate:'待确认',confirmed:'已确认',rejected:'已拒绝'}[t.status]||t.status)));for(const e of t.evidence||[])card.append(node('pre',e.text));const meaning=document.createElement('textarea');meaning.value=t.meaning;meaning.maxLength=160;meaning.placeholder='释义，确认前可修改';const usage=document.createElement('textarea');usage.value=t.usage;usage.maxLength=100;usage.placeholder='使用场合';card.append(meaning,usage);for(const [s,label] of [['confirmed','确认'],['rejected','拒绝']]){const b=node('button',label);b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/slang/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scope,id:t.id,status:s,meaning:meaning.value,usage:usage.value})});const v=await r.json();if(!r.ok)throw Error(v.error);await refresh(scope)}catch(e){$('status').textContent=e.message;b.disabled=false}};card.append(b)}$('terms').append(card)}if(!d.terms.length)$('terms').append(node('small','暂无用语候选；不会为了学习自动启动模型'));$('status').textContent='已读取本机会话状态'}catch(e){$('status').textContent=e.message}}
$('scope').onchange=()=>refresh($('scope').value);refresh('test:'+testId);
</script></html>
